[book]
title = "The Pxc Language Reference"
authors = ["Pen-NineCat"]
language = "zh-Hans"
src = "../Docs/Reference"

[output.html]
site-url = "/Pxc/"
additional-css = ["theme/pxc.css"]
# CJK search addition
additional-js = ["theme/rule-fit.js", "theme/cjk-search.js"]
git-repository-url = "https://github.com/Pen-NineCat/Pxc"
edit-url-template = "https://github.com/Pen-NineCat/Pxc/edit/master/Docs/book/{path}"
no-section-label = true

[output.html.fold]
enable = true
level = 0

[output.html.search]
use-boolean-and = true

[preprocessor.pxc-spec]
command = "python tools/pxc_spec.py"
