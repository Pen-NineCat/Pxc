# clang-format check for pull requests.
#
# The C++ CI is opt-in: it only runs for PRs carrying the `ci:cpp` label. A path filter cannot
# tell "docs", "tools" and however many other C++-free paths apart without listing them one by one,
# so the label decides instead of `paths` / `paths-ignore`.
name: CI / Format

on:
  pull_request:
    branches: [ master ]
    # `labeled` is needed because adding the label after the PR was opened has to start the CI.
    types: [ opened, synchronize, reopened, ready_for_review, labeled ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # .clang-format uses options that only exist in recent releases and the formatting result itself
  # is version dependent, so the version is pinned to the one used locally, not "whatever the
  # runner ships".
  CLANG_FORMAT_VERSION: '22.1.3'

jobs:
  clang-format:
    name: clang-format
    # `workflow_dispatch` always runs; on pull requests the opt-in label decides. The `action`
    # guard keeps `labeled` events of unrelated labels from re-running the job.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action == 'labeled' && github.event.label.name == 'ci:cpp')
      || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci:cpp'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The system interpreter of the runner is externally managed (PEP 668), a setup-python one
      # keeps `pip install` out of the system site-packages.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: python -m pip install --disable-pip-version-check "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check formatting
        run: |
          clang-format --version
          mapfile -t sources < <(git ls-files -- '*.h' '*.hpp' '*.c' '*.cpp' '*.cc' '*.cxx')
          printf 'Checking %d C/C++ files\n' "${#sources[@]}"
          if [ "${#sources[@]}" -eq 0 ]; then
            exit 0
          fi
          clang-format --dry-run --Werror "${sources[@]}"

      # The check above only says "this file should be reformatted", this step shows the exact diff.
      - name: Show what clang-format would change
        if: failure()
        run: |
          mapfile -t sources < <(git ls-files -- '*.h' '*.hpp' '*.c' '*.cpp' '*.cc' '*.cxx')
          clang-format -i "${sources[@]}"
          git --no-pager diff
