# E00xx: lexer diagnostics (Code/PLang/Lex). E01xx: parser diagnostics (Code/PLang/Syntax).
# Wxxxx: warnings. Append new codes to the end of their group; never reuse a deleted number.

# ---------------------------------------------------------------------------
# Lexer
# ---------------------------------------------------------------------------

- code   : E0006
  name   : UndefinedSymbol
  level  : Error
  message: "Undefined symbol {}"
  args   : [string]
- code   : E00010
  name   : UnterminatedStringLiteral
  level  : Error
  message: "Unterminated string literal"
  args   : []
- code   : E00014
  name   : UnterminatedCharLiteral
  level  : Error
  message: "Unterminated character literal"
  args   : []
- code   : E00015
  name   : InvalidCharCodepoint
  level  : Error
  message: "Invalid character codepoint"
  args   : []
- code   : E00016
  name   : InvalidEscapeSequences
  level  : Error
  message: "Invalid escape sequences"
  args   : []
- code   : E00017
  name   : UnterminatedCommentLiteral
  level  : Error
  message: "Unterminated comment literal"
  args   : []
- code   : E00018
  name   : InvalidNumericSeparatorsPosition
  level  : Error
  message: "Invalid number separators position"
  args   : []
- code   : E00019
  name   : InvalidNumericLiteralPosition
  level  : Error
  message: "Invalid number literal position"
  args   : []
- code   : E00020
  name   : InvalidNonASCIICodepointPosition
  level  : Error
  message: "Non ASCII codepoint can't be used in identification or operator"
  args   : []

# ---------------------------------------------------------------------------
# Parser
# ---------------------------------------------------------------------------

- code   : E0100
  name   : ModuleMustBeFirst
  level  : Error
  message: "Module declaration must be the first declaration"
  args   : []
- code   : E0101
  name   : ExpectSemi
  level  : Error
  message: "Please input ;"
  args   : []
- code   : E0102
  name   : ExpectCharacterNotFound
  level  : Error
  message: "Expect {} but get {}"
  args   : [string, string]
- code   : E0103
  name   : ExclusiveTypeQualifiers
  level  : Error
  message: "Exclusive type qualifiers with {} and {}"
  args   : [string, string]
- code   : E0104
  name   : DuplicateTypeQualifiers
  level  : Error
  message: "Duplicate type qualifier {}"
  args   : [string]
- code   : E0106
  name   : PleaseInputIdent
  level  : Error
  message: "Please input identifier"
  args   : []
- code   : E0107
  name   : ImportMustBeAtHeader
  level  : Error
  message: "Import and friend module declarations must appear before any other declaration"
  args   : []
- code   : E0108
  name   : InvalidNullableType
  level  : Error
  message: "Only one '?' may end a type"
  args   : []
- code   : E0109
  name   : UnclosedTemplateArgumentList
  level  : Error
  message: "Unclosed template argument list"
  args   : []
- code   : E0110
  name   : ExpectType
  level  : Error
  message: "Please input type"
  args   : []
- code   : E0111
  name   : InvalidTypeQualifierOrder
  level  : Error
  message: "Type qualifiers must be written as 'const ref dyn', or 'mov' alone"
  args   : []
- code   : E0112
  name   : UnmatchedGreater
  level  : Error
  message: "Unexpected '>' that closes no template argument list"
  args   : []
- code   : E0113
  name   : InvalidImportPrefixOrder
  level  : Error
  message: "Import prefixes must be written as 'public using import'"
  args   : []
